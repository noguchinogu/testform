<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Speaking Test Timer</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #222; color: #fff; padding-top: 50px; }
        .timer { font-size: 80px; font-weight: bold; color: #ff5252; margin: 30px 0; }
        .status { font-size: 24px; color: #aaa; margin-bottom: 10px; }
        #img-container { margin-top: 20px; }
        img { max-width: 90%; max-height: 60vh; border: 8px solid #444; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="status" id="status">Section 1 / 5</div>
    <div class="timer" id="time">02:30</div>
    <div id="img-container">
        <img id="q-img" src="https://drive.google.com/file/d/1_zXXFR7X7L4ZeG9W-vVcHZu-39zbwMP5/view?usp=sharing">
    </div>

    <script>
        const images = [
            "https://drive.google.com/file/d/1_zXXFR7X7L4ZeG9W-vVcHZu-39zbwMP5/view?usp=sharing", "https://drive.google.com/file/d/1_zXXFR7X7L4ZeG9W-vVcHZu-39zbwMP5/view?usp=sharing", "https://drive.google.com/file/d/1_zXXFR7X7L4ZeG9W-vVcHZu-39zbwMP5/view?usp=sharing", "https://drive.google.com/file/d/1_zXXFR7X7L4ZeG9W-vVcHZu-39zbwMP5/view?usp=sharing", "https://drive.google.com/file/d/1_zXXFR7X7L4ZeG9W-vVcHZu-39zbwMP5/view?usp=sharing"
        ];
        let current = 0;
        let timeLeft = 150; // 2.5分 = 150秒

        function update() {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('time').innerText = `${m}:${s.toString().padStart(2,'0')}`;
            
            if (timeLeft <= 0) {
                current++;
                if (current < 5) {
                    timeLeft = 150;
                    document.getElementById('q-img').src = images[current];
                    document.getElementById('status').innerText = `Section ${current + 1} / 5`;
                } else {
                    document.body.innerHTML = "<h1>Test Complete. <br>Please stop recording and leave the meeting.</h1>";
                }
            }
            timeLeft--;
        }
        setInterval(update, 1000);
    </script>
</body>
</html>
