<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(26)研修フォーム② - 記述テスト</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; }
    h2 { color: #1a73e8; margin-bottom: 20px; }
    input { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    textarea { width: 90%; height: 150px; padding: 12px; margin-bottom: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; resize: vertical; }
    .char-count { font-size: 14px; color: #666; margin-bottom: 15px; text-align: right; width: 90%; margin-left: auto; margin-right: auto; }
    button { padding: 15px 30px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; width: 90%; transition: 0.3s; }
    button:hover { background: #1557b0; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .timer { font-size: 48px; font-weight: bold; color: #e53935; margin: 20px 0; font-family: monospace; }
    .loader { display: inline-block; width: 30px; height: 30px; border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .status-text { font-size: 18px; font-weight: bold; margin-top: 15px; color: #555; }

    #custom-confirm { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
    .confirm-box { background: white; padding: 30px; border-radius: 10px; width: 80%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .confirm-box p { font-size: 18px; font-weight: bold; margin-bottom: 25px; }
    .btn-wrap { display: flex; justify-content: space-between; }
    .btn-yes { background: #e53935; width: 48%; }
    .btn-yes:hover { background: #c62828; }
    .btn-no { background: #757575; width: 48%; }
    .btn-no:hover { background: #616161; }
  </style>
</head>
<body>

<div id="custom-confirm">
  <div class="confirm-box">
    <p>このセクションの回答を終了して次に進みますか？<br><span style="font-size:14px; color:#666; font-weight:normal;">(時間は進み続けます)</span></p>
    <div class="btn-wrap">
      <button class="btn-yes" onclick="executeNext()">はい</button>
      <button class="btn-no" onclick="closeConfirm()">いいえ</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="auth-view">
    <h2>(26)研修フォーム②</h2>
    <p>基本情報と同じ内容を入力してください。</p>
    <input type="text" id="email" placeholder="メールアドレス">
    <input type="text" id="id" placeholder="ID（数字6桁）">
    <input type="text" id="name" placeholder="氏名">
    <button onclick="startAuth()">認証してスタート</button>
    <div id="auth-status" class="status-text" style="display:none;">
      <div class="loader"></div><br>認証中...
    </div>
  </div>

  <div id="test-view" style="display:none;">
    <h3 id="section-title">セクション 1 / 5</h3>
    <div class="timer" id="time">02:30</div>
    <textarea id="answer-text" placeholder="ここに回答を入力してください（500字以内）" maxlength="500" oninput="updateCharCount()"></textarea>
    <div class="char-count"><span id="char-current">0</span> / 500</div>
    <button id="next-btn" onclick="nextSection(false)">回答を終了して次へ</button>
  </div>

  <div id="loading-view" style="display:none;">
    <h2>処理中...</h2>
    <div class="loader"></div>
    <p id="loading-text" class="status-text"></p>
  </div>

  <div id="result-view" style="display:none;">
    <h2 id="result-title">採点完了</h2>
    <p id="result-message" class="status-text"></p>
  </div>
</div>

<script>
  // ★今の動いている新しいGASのURLを貼り付けてください
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzGk2BPpx33si7eU9W_z-WDvbE2CkMZdsoaeJBvQJs3ZW9TIikxCD8Ksah4_1zlQfUDLQ/exec"; 

  let user = {}, cur = 1, timerInterval;
  let answers = []; 
  let isTesting = false; 

  function handleFocusLost() {
    if (isTesting && document.getElementById('test-view').style.display === 'block') {
      alert("【警告】別の画面やアプリへの移動が検知されました。\n不正防止のため、現在のセクションを強制終了して次に進みます。");
      executeNext();
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) handleFocusLost();
  });

  window.addEventListener("blur", () => {
    handleFocusLost();
  });

  window.addEventListener('beforeunload', function (e) {
    if (isTesting) {
      e.preventDefault();
      e.returnValue = ''; 
    }
  });

  // 文字数をカウントする関数
  function updateCharCount() {
    const textLength = document.getElementById('answer-text').value.length;
    document.getElementById('char-current').innerText = textLength;
  }

  async function callGas(data) {
    const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(data) });
    return await res.json();
  }

  async function startAuth() {
    user = { 
      email: document.getElementById('email').value.trim(), 
      id: document.getElementById('id').value.trim(), 
      name: document.getElementById('name').value.trim() 
    };
    if (!user.email || !user.id || !user.name) return alert("すべての項目を入力してください。");

    document.getElementById('auth-status').style.display = 'block';

    try {
      const res = await callGas({ action: "auth", user: user });
      
      if (res.success) {
        isTesting = true; 
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('test-view').style.display = 'block';
        startSection();
      } else {
        alert(res.message || res.error || "通信エラーが発生しました。");
        document.getElementById('auth-status').style.display = 'none';
      }
    } catch (e) {
      alert("通信エラーが発生しました。");
      document.getElementById('auth-status').style.display = 'none';
    }
  }

  function startSection() {
    // テキストエリアを空にして文字数をリセット
    document.getElementById('answer-text').value = '';
    updateCharCount();

    const endTime = Date.now() + 150 * 1000; 
    document.getElementById('time').innerText = "02:30"; 
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      let timeLeft = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      document.getElementById('time').innerText = `${m}:${s.toString().padStart(2,'0')}`;
      
      if (timeLeft <= 0) {
        executeNext(); 
      }
    }, 1000);
  }

  function nextSection(isAuto) {
    if (!isAuto) {
      document.getElementById('custom-confirm').style.display = 'flex';
    }
  }

  function closeConfirm() {
    document.getElementById('custom-confirm').style.display = 'none';
  }

  function executeNext() {
    if (document.getElementById('test-view').style.display === 'none') return;

    document.getElementById('custom-confirm').style.display = 'none'; 
    clearInterval(timerInterval);
    
    // 入力されているテキストを配列に保存
    const currentText = document.getElementById('answer-text').value;
    answers.push(currentText);

    if (cur < 5) {
      cur++;
      document.getElementById('section-title').innerText = `セクション ${cur} / 5`;
      startSection();
    } else {
      finishTest();
    }
  }

  async function finishTest() {
    document.getElementById('test-view').style.display = 'none';
    document.getElementById('loading-view').style.display = 'block';
    document.getElementById('loading-text').innerHTML = "回答を送信中... AIが最終採点しています (約10秒)<br>画面を閉じないでください。";
    
    // 5つ分のテキストが入った配列(answers)をGASへ送信
    const res = await callGas({ action: "submit", user: user, answers: answers }); 
    
    isTesting = false; 
    
    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('result-view').style.display = 'block';
    
    let score = res.score || 0;
    document.getElementById('result-title').innerText = `最終点数: ${score}点`;
    
    let msg = score >= 30 
      ? "<b>【合格】</b>おめでとうございます。<br>次は「フォーム④」に進んでください。" 
      : "<b>【不合格】</b>残念ですが基準に達しませんでした。<br>次は「フォーム③」に進んでください。";
    document.getElementById('result-message').innerHTML = msg;
  }
</script>

</body>
</html>
