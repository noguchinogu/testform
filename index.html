<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(26)研修フォーム②</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f4f7f6; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    textarea { height: 150px; font-size: 16px; }
    button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
    .timer { font-size: 30px; color: #d9534f; font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>
  <div id="auth-section" class="card">
    <h2>(26)研修フォーム②</h2>
    <input type="text" id="email" placeholder="メールアドレス">
    <input type="text" id="id" placeholder="ID (数字6桁)">
    <input type="text" id="name" placeholder="氏名">
    <button onclick="authenticate()">スタート</button>
  </div>

  <div id="test-section" class="card" style="display:none;">
    <div id="status">Section 1 / 5</div>
    <div class="timer" id="time">03:00</div>
    <textarea id="answer" placeholder="ここに回答を記述してください"></textarea>
    <button onclick="nextSection()">次へ進む</button>
  </div>

  <div id="result-section" class="card" style="display:none;">
    <h2 id="result-text">採点中...</h2>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwn9hNLSPJmXKGz71BRGMgA9GMaPgUePXB4FM2OC8sWRi04PthK1AnbnPka_5dxzOv9CQ/exec";
    let user = {}, answers = [], cur = 1, timeLeft = 180, timer;

    async function authenticate() {
      user = { 
        email: document.getElementById('email').value.trim(), 
        id: document.getElementById('id').value.trim(),
        name: document.getElementById('name').value.trim()
      };
      const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "auth", user: user }) });
      const data = await res.json();
      if (data.success) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('test-section').style.display = 'block';
        startTimer();
      } else { alert("認証に失敗しました。メアドとIDを確認してください。"); }
    }

    function startTimer() {
      timeLeft = 180;
      timer = setInterval(() => {
        let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        document.getElementById('time').innerText = `${m}:${s.toString().padStart(2,'0')}`;
        if (timeLeft-- <= 0) nextSection();
      }, 1000);
    }

    async function nextSection() {
      clearInterval(timer);
      answers.push(document.getElementById('answer').value);
      document.getElementById('answer').value = "";
      
      if (cur < 5) {
        cur++;
        document.getElementById('status').innerText = `Section ${cur} / 5`;
        startTimer();
      } else {
        submitTest();
      }
    }

    async function submitTest() {
      document.getElementById('test-section').style.display = 'none';
      document.getElementById('result-section').style.display = 'block';
      const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "submit", user: user, answers: answers }) });
      const data = await res.json();
      
      let msg = `点数: ${data.score}点\n`;
      msg += (data.score >= 30) ? "【合格】フォーム④に進んでください。" : "【不合格】フォーム③に進んでください。";
      document.getElementById('result-text').innerText = msg;
    }
  </script>
</body>
</html>
